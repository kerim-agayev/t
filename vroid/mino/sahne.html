document.body.append(renderer.domElement);
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.1, 60);

arka.position.set(-3, 2, -2);
scene.add(gunes, arka, new THREE.AmbientLight(0xffffff, 0.95));
const yer = new THREE.Mesh(new THREE.CircleGeometry(12, 64), new THREE.MeshToonMaterial({ color: 0xf6dcc0 }));
yer.rotation.x = -Math.PI / 2;
yer.receiveShadow = true;
scene.add(yer);

  ["Şaşkın", 2.35, -0.3, (m) => { m.kolSag.rotation.set(-1.0, 0, 0.7); m.kolSol.rotation.set(-1.0, 0, -0.7); m.bas.rotation.x = -0.06; m.yuz({ goz: "buyuk", agiz: "o", kas: 1 }); }],

  scene.add(m.kok);
  const e = Object.assign(document.createElement("div"), { className: "ad", textContent: ad });
  e.style.left = `${50 + x * 15}%`;
  document.body.append(e);
}
document.body.append(Object.assign(document.createElement("h1"), { textContent: "Mino" }));
