<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>Pavlov'un köpeği — anlatımlı</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0b0620;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh;font:16px system-ui;color:#fff}
  svg{width:min(96vw,150vh);background:#fffdf8;border-radius:8px;font-family:Caveat,"Segoe Print",cursive;font-weight:700;fill:#1c1c1c;cursor:pointer}
  nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:min(96vw,150vh)}
  button{background:#2b1d5c;color:#fff;border:0;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
  button.on{background:#7b4ae0}
  input{flex:1;min-width:150px}
  .render{display:block;min-height:0}
  .render svg{width:100vw;height:100vh;border-radius:0;display:block}
  .render nav{display:none}
</style>
<svg id="s" viewBox="0 0 1600 900" role="img" aria-label="Klasik koşullanmanın dört aşaması: yemek salya yapar, zil tepki yaratmaz, ikisi eşleştirilir, sonunda zil tek başına salya yaptırır">
  <defs>
    <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
</svg>
<nav><button id="play">▶ Oynat</button><input id="bar" type="range" min="0" step="0.05" value="0" aria-label="Video konumu"></nav>
<nav id="chapters"></nav>
<audio id="audio" src="narration.mp3" preload="auto"></audio>
<script src="timing.js"></script>
<script>
const S = document.getElementById('s');
const items = [], anims = [];
let seg = 0;
function make(tag, attrs, parent) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.append(e); return e;
}
const G = make('g', {filter: 'url(#w)'}, S);   // titreme filtresi tek grupta, yazılar net
function el(tag, attrs, text) {
  const e = make(tag, attrs, tag === 'text' ? S : G);
  if (text != null) e.textContent = text;
  items.push({e, tag, seg}); return e;
}
// hareketli parça: f(saniye) -> [transform, opacity]
const move = (e, f) => { anims.push({e, f, seg}); return e; };
const txt = (x, y, t, size = 30, extra = {}) => el('text', {x, y, 'font-size': size, 'text-anchor': 'middle', ...extra}, t);
const path = (d, stroke = '#222', width = 3, fill = 'none', extra = {}) =>
  el('path', {d, stroke, 'stroke-width': width, fill, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...extra});
const oval = (x, y, rx, ry, fill = 'none', stroke = '#222', width = 3) =>
  path(`M${x-rx} ${y}a${rx} ${ry} 0 1 0 ${2*rx} 0a${rx} ${ry} 0 1 0 ${-2*rx} 0`, stroke, width, fill);
const marker = (x, y, w, color) => path(`M${x-w/2} ${y}q${w/2} -5 ${w} 0`, color, 16, 'none', {opacity: .55});
function arrow(x1, y1, x2, y2, color = '#f2a100', bend = -30) {
  const cx = (x1+x2)/2, cy = (y1+y2)/2 + bend, a = Math.atan2(y2-cy, x2-cx);
  path(`M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`, color, 5, 'none', {'stroke-dasharray': '12 9'});
  path(`M${x2-18*Math.cos(a-.55)} ${y2-18*Math.sin(a-.55)}L${x2} ${y2}L${x2-18*Math.cos(a+.55)} ${y2-18*Math.sin(a+.55)}`, color, 5);
}
const swing = (deg, hz, x, y) => s => [`rotate(${deg*Math.sin(2*Math.PI*hz*s)} ${x} ${y})`, ''];

// köpek: (x, y) = kafa merkezi
function dog(x, y, drool) {
  const fur = '#e9b46a', dark = '#8a5a2b';
  const tail = path(`M${x+38} ${y+118}q62 6 ${drool ? 66 : 54} ${drool ? -52 : -8}`, dark, 13);
  if (drool) move(tail, swing(14, 2.5, x+38, y+118));
  path(`M${x-52} ${y+135}Q${x-62} ${y+45} ${x} ${y+42}Q${x+62} ${y+45} ${x+52} ${y+135}Z`, '#222', 3, fur);
  oval(x, y+108, 24, 28, '#fff1da', 'none', 0);
  for (const d of [-24, 24]) oval(x+d, y+134, 18, 10, fur);
  oval(x, y, 56, 52, fur);
  for (const s of [-1, 1]) {
    const ear = path(`M${x+s*40} ${y-38}Q${x+s*92} ${y-40} ${x+s*74} ${y+30}Q${x+s*56} ${y+36} ${x+s*50} ${y-4}Z`, '#222', 3, dark);
    if (!drool) move(ear, swing(s*7, 1.1, x+s*40, y-38));   // zili duyan kulaklar
  }
  oval(x, y+22, 30, 22, '#fff1da');
  oval(x, y+10, 11, 8, '#222');
  path(`M${x} ${y+18}v10M${x-15} ${y+27}q8 10 15 1q7 9 15-1`);
  for (const d of [-21, 21]) {
    if (drool) path(`M${x+d-9} ${y-13}q9-13 18 0`, '#222', 4);
    else oval(x+d, y-15, 6, 7, '#222');
  }
  if (drool) {
    path(`M${x-9} ${y+34}q-2 24 10 24t9-24Z`, '#222', 2.5, '#f2808a');
    [[-22, 48, 7], [-30, 74, 9], [24, 60, 6]].forEach(([dx, dy, r], i) =>
      move(path(`M${x+dx} ${y+dy-r*2}q${r*1.4} ${r*2} 0 ${r*2.6}q${-r*1.4}-${r*.6} 0-${r*2.6}Z`, '#2f8fd8', 2.5, '#a9dcff'),
        s => { const f = (s*1.3 + i*.37) % 1; return [`translate(0 ${f*26})`, 1 - f*f]; }));
  }
}
function food(x, y) {
  for (const [dx, dy] of [[-34,-8],[-10,-16],[16,-10],[36,-4],[2,-2],[-20,2]]) oval(x+dx, y+dy, 15, 12, '#a8642a');
  path(`M${x-68} ${y}H${x+68}L${x+48} ${y+45}H${x-48}Z`, '#222', 3, '#e8594a');
  txt(x, y+33, 'MAMA', 26, {fill: '#fff'});
}
function bell(x, y) {
  const ring = swing(16, 2.2, x, y-52);
  move(oval(x, y-52, 10, 10, '#ffd84d'), ring);
  move(path(`M${x-50} ${y+30}Q${x-34} ${y+18} ${x-34} ${y-8}Q${x-32} ${y-44} ${x} ${y-44}Q${x+32} ${y-44} ${x+34} ${y-8}Q${x+34} ${y+18} ${x+50} ${y+30}Z`, '#222', 3, '#ffd84d'), ring);
  move(oval(x, y+40, 11, 10, '#c98a00'), swing(28, 2.2, x, y-52));
  for (const s of [-1, 1]) move(path(`M${x+s*58} ${y-28}q${s*14} 16 0 34M${x+s*76} ${y-40}q${s*22} 28 0 58`, '#f2a100', 4),
    t => ['', .25 + .75*Math.abs(Math.sin(2*Math.PI*2.2*t))]);
  move(txt(x+88, y-55, 'DİNG!', 32, {fill: '#c98a00'}), t => [`translate(0 ${-5*Math.abs(Math.sin(2*Math.PI*2.2*t))})`, '']);
}

// 0: giriş (başlık, Pavlov, telefon sorusu)
seg = 0;
marker(800, 78, 600, '#ffd84d');
txt(800, 82, "Pavlov'un Köpeği", 78);
txt(800, 132, 'Klasik koşullanma: beyin iki şeyi birbirine nasıl bağlar?', 38, {fill: '#6a35c9'});
path('M76 150q4-34 34-34t34 34Z', '#222', 3, '#8da0b8');
oval(110, 74, 32, 36, '#ffe3c8');
path('M80 80Q76 130 110 134Q144 130 140 80Q126 102 110 94Q94 102 80 80Z', '#222', 3, '#eee');
path('M82 54q28-30 56 0', '#bbb', 8);
for (const d of [-12, 12]) { oval(110+d, 70, 10, 10, '#fff', '#222', 2); el('circle', {cx: 110+d, cy: 70, r: 3}); }
txt(215, 80, 'Pavlov', 36); txt(215, 112, '(yaklaşık 1900)', 24, {fill: '#666'});
path('M190 830h1220v55h-1220Z', '#222', 2.5, '#fff3cf');
txt(800, 868, 'Sende de var: telefonun "bip" sesini duyunca elin kendiliğinden telefona gidiyor mu?', 33);

// 1-4: paneller
const panels = [
  [40, 165, '① Önce', '#d8f3cf', 'yemek → salya', 'koşulsuz uyarıcı → koşulsuz tepki'],
  [815, 165, '② Zil tek başına', '#e4e4e4', 'zil → tepki yok', 'nötr uyarıcı'],
  [40, 495, '③ Eşleştirme', '#ffd0a8', 'zil + yemek → salya', 'defalarca tekrarlanır'],
  [815, 495, '④ Sonra', '#bfe3ff', 'sadece zil → salya!', 'koşullu uyarıcı → koşullu tepki'],
];
const scenes = [
  () => { food(255, 300); arrow(350, 300, 500, 295); },
  () => { bell(1030, 305); arrow(1125, 300, 1275, 295, '#999');
          move(txt(1515, 285, '?', 90, {fill: '#999'}), s => [`translate(0 ${8*Math.sin(5*s)})`, '']); },
  () => { bell(150, 630); txt(240, 645, '+', 70); food(345, 628); arrow(425, 590, 530, 600);
          const spin = s => [`rotate(${s*220} 545 544)`, ''];
          move(path('M545 524a20 20 0 1 1-17 30', '#e8402f', 5), spin); move(path('M522 538l6 17 17-7', '#e8402f', 5), spin);
          txt(645, 552, '× tekrar', 34, {fill: '#e8402f'}); },
  () => { bell(1030, 635); arrow(1125, 630, 1275, 625, '#e8402f'); txt(1440, 548, 'Yemek yok!', 34, {fill: '#e8402f'}); },
];
panels.forEach(([x, y, name, color, formula, term], i) => {
  seg = i + 1;
  path(`M${x} ${y}h745v315h-745Z`, '#222', 2.5, '#fff');
  marker(x+160, y+42, 270, color); txt(x+160, y+48, name, 44);
  scenes[i]();                         // önce uyarıcı, sonra köpeğin tepkisi
  dog(x+590, y+135, i !== 1);
  txt(x+215, y+265, formula, 40, {fill: i === 3 ? '#e8402f' : '#1c1c1c'});
  txt(x+215, y+298, term, 27, {fill: '#6a35c9'});
});
// 5: yeni çizim yok, tüm sahneler birlikte oynar

// --- zaman çizelgesi
const starts = DUR.map((_, i) => DUR.slice(0, i).reduce((a, b) => a + b, 0));
const TOTAL = DUR.reduce((a, b) => a + b, 0);
const share = i => i >= 1 && i <= 4 ? .6 : .8;   // sesin ne kadarı çizime ayrılır (make_video.py DING ile aynı)
for (const it of items) {
  it.len = it.tag === 'path' ? it.e.getTotalLength() : 0;
  it.dashed = it.e.hasAttribute('stroke-dasharray');
  it.weight = it.tag === 'text' ? .3 + it.e.textContent.length*.05 : .15 + it.len/1500;
}
DUR.forEach((d, i) => {
  const list = items.filter(it => it.seg === i);
  const total = list.reduce((a, it) => a + it.weight, 0);
  let t = starts[i] + .2;
  for (const it of list) { it.start = t; it.dur = it.weight/total*d*share(i); t += it.dur; }
});

const pen = make('g', {}, S);
pen.innerHTML = '<path d="M0 0l8-22 34-34 14 14-34 34Z" fill="#ffc83d" stroke="#222" stroke-width="2.5"/><path d="M0 0l8-22 14 14Z" fill="#222"/>';

// panel n: çizimi bitince kendi bölümünün sonuna kadar, finalde hepsi birlikte oynar
function playing(n, t) {
  const from = starts[n] + .2 + DUR[n]*share(n);
  if (t >= from && t < starts[n] + DUR[n]) return t - from;
  const finale = starts[5] + .3;
  return t >= finale && t < TOTAL - .3 ? t - finale : null;
}

function render(t) {
  let tip = null;
  for (const it of items) {
    const p = Math.min(1, Math.max(0, (t - it.start) / it.dur)), s = it.e.style;
    s.visibility = p ? 'visible' : 'hidden';
    const wipe = it.tag !== 'path' || it.dashed;
    s.clipPath = wipe && p < 1 ? `inset(-30px ${(1-p)*100}% -30px -30px)` : '';
    if (!wipe) {
      s.strokeDasharray = p < 1 ? `${it.len} ${it.len}` : '';
      s.strokeDashoffset = p < 1 ? it.len*(1-p) : '';
      s.fillOpacity = p < 1 ? Math.max(0, p*2 - 1) : '';
    }
    if (p > 0 && p < 1) {
      if (it.tag === 'path') tip = it.e.getPointAtLength(it.len*p);
      else { const b = it.e.getBBox(); tip = {x: b.x + b.width*p, y: b.y + b.height*.7}; }
    }
  }
  pen.style.visibility = tip ? 'visible' : 'hidden';
  if (tip) pen.setAttribute('transform', `translate(${tip.x} ${tip.y})`);

  let moving = false;
  for (const a of anims) {
    const s = playing(a.seg, t);
    const [transform, opacity] = s === null ? ['', ''] : a.f(s);
    moving ||= s !== null;
    a.e.setAttribute('transform', transform);
    a.e.style.opacity = opacity;
  }
  // kare anahtarı: aynıysa video üretici ekran görüntüsünü yeniden kullanır
  return [items.filter(i => t > i.start).length, tip || moving ? t : ''].join();
}

// --- oynatıcı
const $ = id => document.getElementById(id);
const audio = $('audio'), bar = $('bar'), play = $('play');
bar.max = TOTAL;
const chapters = ['Soru', 'Önce', 'Zil', 'Eşleştirme', 'Sonra', 'Sende de var'].map((name, i) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { audio.currentTime = starts[i]; audio.play(); };
  $('chapters').append(b); return b;
});
const toggle = () => audio.paused ? audio.play() : audio.pause();
play.onclick = S.onclick = toggle;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
bar.oninput = () => { audio.currentTime = bar.value; render(+bar.value); };
audio.onplay = audio.onpause = () => play.textContent = audio.paused ? '▶ Oynat' : '⏸ Duraklat';
if (location.search === '?render') document.body.className = 'render';
else (function loop() {
  const t = audio.currentTime;
  render(t); bar.value = t;
  chapters.forEach((b, i) => b.classList.toggle('on', t >= starts[i] && t < starts[i] + DUR[i]));
  requestAnimationFrame(loop);
})();
</script>
</html>
